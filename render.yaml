services:
  # FastAPI Backend Service
  - type: web
    name: trustfed-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://frontend-3qgo.vercel.app,http://localhost:5173
      - key: ALLOW_DEMO_USERS
        value: "true"
      - key: DEMO_PASSWORD
        value: password123
      - key: SUPABASE_DB_URL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: meta/llama-3.1-70b-instruct

