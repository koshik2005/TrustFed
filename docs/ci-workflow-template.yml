name: TrustFed CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend Lint, Security & Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Auth & Security Tests
        run: python tests/test_auth_and_security.py

      - name: Run Backend Services Tests
        run: python tests/test_services.py

      - name: Run TEFL Algorithmic & Cryptographic Tests
        run: python tests/test_tefl.py

      - name: Run Clinical Risk Presets Inference Tests
        run: python tests/verify_presets.py

      - name: Run Privacy Honesty & Accountant Verification Tests
        run: python tests/test_privacy_honesty.py

  frontend-ci:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Oxlint (0 Warnings Policy)
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Build Production Bundle (Typecheck + Vite)
        run: npm run build
